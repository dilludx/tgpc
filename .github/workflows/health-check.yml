name: Web Health Check

on:
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9 AM UTC
  workflow_dispatch:

jobs:
  check-website:
    name: Website Status
    runs-on: ubuntu-latest
    steps:
      - name: Check Website Availability
        run: |
          echo "Checking website status..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://dilludx.github.io/tgpc/)
          
          echo "### 🏥 Web Health Check" >> $GITHUB_STEP_SUMMARY
          echo "> **$(date '+%A, %d %B %Y')** • $(date '+%H:%M %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Website is UP (Status: $STATUS)"
            echo "- **Status**: ✅ Online ($STATUS)" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: https://dilludx.github.io/tgpc/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Website is DOWN (Status: $STATUS)"
            echo "- **Status**: ❌ Offline ($STATUS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
