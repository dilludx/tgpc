name: 🛜 Website Status

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 IST
    - cron: '30 12 * * *'  # 18:00 IST
    - cron: '30 20 * * *'  # 02:00 IST
  workflow_dispatch:

jobs:
  check-website:
    name: Website Status
    runs-on: ubuntu-latest
    steps:
      - name: Check Website Availability
        run: |
          echo "Checking website status..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://tgpc.pages.dev/)
          
          echo "### 🛜 Website Status" >> $GITHUB_STEP_SUMMARY
          echo "> **$(TZ='Asia/Kolkata' date '+%A, %d %B %Y')** • $(TZ='Asia/Kolkata' date '+%H:%M IST')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Website is UP (Status: $STATUS)"
            echo "- **Status**: ✅ Online ($STATUS)" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: https://tgpc.pages.dev/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Website is DOWN (Status: $STATUS)"
            echo "- **Status**: ❌ Offline ($STATUS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
