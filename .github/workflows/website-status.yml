name: 🛜 Website Status

on:
  # Called by rx-sync workflow after sync completes
  workflow_call:
  # Manual trigger
  workflow_dispatch:

jobs:
  check-website:
    name: Website Status
    runs-on: ubuntu-latest
    steps:
      - name: Check Website Availability
        run: |
          echo "Checking website status..."
          
          # Exponential backoff - optimal for variable deployment times
          for i in {1..6}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://tgpc.pages.dev/ --max-time 5)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Website is UP (Status: $STATUS) - Attempt $i"
              {
                echo "### 🛜 Website Status • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')"
                echo ""
                echo "✅ Online ($STATUS) • https://tgpc.pages.dev/"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ "$i" -eq 6 ]; then
              echo "🛑 Website is DOWN (Status: $STATUS) after 6 attempts"
              {
                echo "### 🛜 Website Status • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')"
                echo ""
                echo "🛑 Offline ($STATUS) • https://tgpc.pages.dev/"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              echo "Attempt $i/6 - Status: $STATUS - waiting $((2**i)) seconds..."
              sleep $((2**i))
            fi
          done
