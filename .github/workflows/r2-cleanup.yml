name: R2 Notice Cleanup
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install awscli --quiet
      - run: |
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          for key in \
            notice/CIRCULAR_3.pdf \
            notice/Candidate_Registration_Enrollement.pdf \
            notice/Circular_1.pdf \
            notice/Circular_2.pdf \
            notice/Election_Gazette.pdf \
            notice/Exit_Exam_DPharm.pdf \
            notice/Notice_Nov_11_2025_holiday.jpeg \
            notice/TGPCRC8882026DPharm.jpg \
            notice/TGPCRC8882026DPharmPCI.jpg \
            notice/Vocational_Courses_Bridge_Courses.pdf \
            notice/circular_161224.jpeg \
            notice/dpharm_affidavit.jpeg \
            notice/dpharm_circular.jpeg \
            notice/exit_exam_notification.jpg \
            notice/exit_exam_notification_23022026.jpg \
            notice/exit_examination_circular.jpg \
            notice/exit_examination_circular_23022026.jpg \
            notice/go_ts_to_tg.jpg \
            notice/tspc_emails_changed.jpeg; do
            echo "Deleting $key..."
            aws s3api delete-object --endpoint-url "$ENDPOINT" --bucket tgpc --key "$key" && echo "  OK" || echo "  FAILED"
          done
