name: ⛑️ CI Validate

on:
  pull_request:
    branches: [ main, exp ]
    paths:
      - "tgpc/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: [ main, exp ]
    paths:
      - "tgpc/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile check
        run: python -m compileall -q tgpc scripts tests

      - name: Sanity test
        run: python tests/sanity.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install actionlint
        run: |
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz" \
            -o actionlint.tgz
          tar -xzf actionlint.tgz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint GitHub workflows
        run: actionlint -color
