name: ⛑️ CI Validate

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "tgpc/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
      - ".gitignore"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile check
        run: python -m compileall -q tgpc tests

      - name: Sanity test
        run: python tests/sanity.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Frontend JS syntax check
        run: node --check docs/config.js docs/search.js docs/mobile.js docs/_worker.js

      - name: Install actionlint
        run: |
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz" \
            -o actionlint.tgz
          tar -xzf actionlint.tgz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint GitHub workflows
        run: actionlint -color
