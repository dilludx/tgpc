name: ♻️ Rx Sync

on:
  schedule:
    # Run 6 times daily, evenly spaced (every 4 hours)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST (noon)
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
    - cron: '30 18 * * *'  # 12:00 AM IST (midnight)
    - cron: '30 22 * * *'  # 4:00 AM IST
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false
  push:
    branches: [ exp ]
    paths:
      - '.github/workflows/rx-sync.yml'
      - 'tgpc/**'
      - 'scripts/**'

jobs:
  rx-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Run data update
      id: update
      run: |
        echo "♻️ Starting TGPC data update..."
        
        # Run the update via CLI (outputs stats to GITHUB_OUTPUT automatically)
        python -m tgpc update
        
        echo "success=True" >> $GITHUB_OUTPUT

    
    - name: Check for changes and save new records
      id: changes
      run: |
        if git diff --quiet data/rx.json; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in rx.json"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in rx.json"
          echo ""
          echo "🆕 New Records Added:"
          echo "===================="
          
          # Save new records to a file for later use
          python -c "
        import json
        import subprocess
        
        # Get the diff and extract added lines
        diff_output = subprocess.run(['git', 'diff', 'data/rx.json'], capture_output=True, text=True).stdout
        
        # Parse added records from diff
        new_records = []
        for line in diff_output.split('\n'):
            if line.startswith('+') and not line.startswith('+++') and '{' in line:
                try:
                    # Extract JSON object from the line
                    json_str = line[1:].strip().rstrip(',')
                    record = json.loads(json_str)
                    new_records.append(record)
                except:
                    pass
        
        # Save to file for later use
        with open('/tmp/new_records.json', 'w') as f:
            json.dump(new_records, f)
        
        # Display new records
        if new_records:
            for i, record in enumerate(new_records, 1):
                print(f'{i}. {record.get(\"registration_number\", \"N/A\")} - {record.get(\"name\", \"N/A\")} ({record.get(\"category\", \"N/A\")})')
        else:
            print('No new records could be parsed from diff')
          "
        fi
    
    - name: Sync to Supabase
      if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_sync == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "♻️ Syncing data to Supabase cloud database..."
        python -m tgpc sync
    
    - name: Update last_sync timestamp
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "🕐 Updating last_sync timestamp in Supabase..."
        python3 << 'EOF'
        import os
        from datetime import datetime
        from supabase import create_client

        url = os.environ.get("SUPABASE_URL")
        key = os.environ.get("SUPABASE_SERVICE_KEY")
        
        if url and key:
            supabase = create_client(url, key)
            sync_time = datetime.now().isoformat()
            supabase.table('metadata').upsert({
                'key': 'last_sync',
                'value': sync_time
            }, on_conflict='key').execute()
            print(f"✅ Updated last_sync: {sync_time}")
        else:
            print("⚠️ Missing Supabase credentials")
        EOF
    
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add data files (JSON only)
        git add data/rx.json
        
        # Format category stats for commit message
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        # Generate commit message using Python
        COMMIT_MSG=$(python3 << PYEOF
        import json
        from datetime import datetime, timezone, timedelta
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if stats:
                    parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                    return ', '.join(parts)
                return '0'
            except:
                return '0'
        
        # Get IST time (UTC+5:30) using built-in
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        date_str = now.strftime('%a %d %b %Y').upper()
        time_str = now.strftime('%H:%M IST')
        
        new_cats = format_cats('''${NEW_CATS}''')
        mod_cats = format_cats('''${MOD_CATS}''')
        rem_cats = format_cats('''${REM_CATS}''')
        
        # Build commit message - single line
        msg = f"♻️ Rx Sync • {date_str} • {time_str}"
        
        if new_cats != '0':
            msg += f" • 🆕 New: {new_cats}"
        
        if mod_cats != '0':
            msg += f" • ✏️ Mod: {mod_cats}"
        
        if rem_cats != '0':
            msg += f" • 🗑️ Rem: {rem_cats}"
        
        msg += f" • 📊 Total: ${{ steps.update.outputs.total_records }}"
        
        print(msg)
        PYEOF
        )
        
        git commit -m "$COMMIT_MSG"
        
        # Pull latest changes and merge safely
        git pull origin main --no-rebase
        
        git push
    
    - name: Create update summary
      if: always()
      run: |
        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        echo "### ♻️ Rx Sync • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # Check if there are any changes at all
            has_changes = new_cat_str or mod_cat_str or rem_cat_str
            
            if not has_changes:
                print('✅ No updates')
            else:
                # New Additions
                if new_cat_str:
                    print(f'#### 🆕 New Additions: {new_cat_str}')
                    for r in new_recs:
                        print(f'- {r}')
                    print('')
                
                # Modifications
                if mod_cat_str:
                    print(f'#### ✏️ Modifications: {mod_cat_str}')
                    for r in mod_recs:
                        print(f'- {r}')
                    print('')
                
                # Removals
                if rem_cat_str:
                    print(f'#### 🗑️ Removals: {rem_cat_str}')
                    for r in rem_recs:
                        print(f'- {r}')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> $GITHUB_STEP_SUMMARY
    
    - name: Send email notification
      if: always()
      run: |
        python3 << 'EOF'
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        import os
        
        # Email configuration
        smtp_server = "smtp.gmail.com"
        smtp_port = 587
        sender_email = "${{ secrets.GMAIL_USERNAME }}"
        app_password = "${{ secrets.GMAIL_APP_PASSWORD }}"
        recipient_email = "${{ secrets.NOTIFICATION_EMAIL }}"
        
        # Generate email body
        import subprocess
        from datetime import datetime, timezone, timedelta
        
        # Get IST time
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        sync_time = now.strftime('%d %B %Y, %H:%M IST')
        subject_time = now.strftime('%d%b%Y %a %H:%M IST')
        
        # Get new records
        try:
            with open('/tmp/new_records.json', 'r') as f:
                new_records_content = f.read()
            formatted_records = subprocess.run(
                ['python3', 'scripts/format_new_records.py'], 
                input=new_records_content, 
                text=True, 
                capture_output=True
            ).stdout.strip()
        except:
            formatted_records = 'No new records to display'
        
        # Create HTML email
        new_cat_stats = os.environ.get('NEW_CAT_STATS', 'No new records')
        total_records = os.environ.get('TOTAL_RECORDS', 'Unknown')
        
        html_body = f"""
        <h2>🔄 TGPC Rx Registry Sync Report</h2>
        <p><strong>Sync Time:</strong> {sync_time}</p>
        
        <h3>📊 Summary</h3>
        <p><strong>New Records by Category:</strong> {new_cat_stats}</p>
        <p><strong>Total Records:</strong> {total_records}</p>
        
        <h3>🆕 New Records</h3>
        <pre><code>{formatted_records}</code></pre>
        
        <hr>
        <p><small>This is an automated notification from the TGPC Rx Registry system.</small></p>
        """
        
        # Create message
        msg = MIMEMultipart()
        msg['From'] = f"TGPC Bot <{sender_email}>"
        msg['To'] = recipient_email
        msg['Subject'] = f"♻️ Data Sync - TGPC Rx Registry - {subject_time}"
        msg.attach(MIMEText(html_body, 'html'))
        
        # Send email
        try:
            server = smtplib.SMTP(smtp_server, smtp_port)
            server.starttls()
            server.login(sender_email, app_password)
            server.send_message(msg)
            server.quit()
            print("✅ Email sent successfully")
        except Exception as e:
            print(f"❌ Failed to send email: {e}")
            print(f"Error details: {str(e)}")
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml