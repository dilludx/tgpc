name: ♻️ Rx Sync

on:
  schedule:
    # Run 6 times daily, evenly spaced (every 4 hours)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST (noon)
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
    - cron: '30 18 * * *'  # 12:00 AM IST (midnight)
    - cron: '30 22 * * *'  # 4:00 AM IST
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main, exp ]
    paths:
      - '.github/workflows/rx-sync.yml'
      - 'tgpc/**'
      - 'scripts/**'

jobs:
  rx-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 2
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Run data update
      id: update
      run: |
        echo "♻️ Starting TGPC data update..."
        
        # Run the update via CLI (outputs stats to GITHUB_OUTPUT automatically)
        python -m tgpc update
        
        echo "success=True" >> "$GITHUB_OUTPUT"

    
    - name: Check for changes and save new records
      id: changes
      run: |
        rm -f /tmp/new_records.json

        if git diff --quiet data/rx.json; then
          echo "changes=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected in rx.json"
        else
          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "Changes detected in rx.json"
          echo ""
          echo "🆕 New Records Added:"
          echo "===================="
          
          # Save only truly new registration numbers (JSON-aware, not line-diff based)
          python3 << 'PYEOF'
        import json
        import subprocess
        from pathlib import Path

        current_path = Path("data/rx.json")
        current_records = json.loads(current_path.read_text(encoding="utf-8"))

        base_records = []
        show = subprocess.run(
            ["git", "show", "HEAD:data/rx.json"],
            capture_output=True,
            text=True
        )
        if show.returncode == 0 and show.stdout.strip():
            base_records = json.loads(show.stdout)

        base_ids = {r.get("registration_number") for r in base_records}
        new_records = [
            r for r in current_records
            if r.get("registration_number") and r.get("registration_number") not in base_ids
        ]

        with open("/tmp/new_records.json", "w", encoding="utf-8") as f:
            json.dump(new_records, f, ensure_ascii=False)

        if new_records:
            for i, record in enumerate(new_records, 1):
                print(
                    f"{i}. {record.get('registration_number', 'N/A')} - "
                    f"{record.get('name', 'N/A')} ({record.get('category', 'N/A')})"
                )
        else:
            print("No new records detected")
        PYEOF
        fi
    
    - name: Sync to Supabase
      if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_sync == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "♻️ Syncing data to Supabase cloud database..."
        python -m tgpc sync
    
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add data files (JSON only)
        git add data/rx.json
        
        # Format category stats for commit message
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        # Generate commit message using Python
        COMMIT_MSG=$(python3 << PYEOF
        import json
        from datetime import datetime, timezone, timedelta
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if stats:
                    parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                    return ', '.join(parts)
                return '0'
            except:
                return '0'
        
        # Get IST time (UTC+5:30) using built-in
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        date_str = now.strftime('%a %d %b %Y').upper()
        time_str = now.strftime('%H:%M IST')
        
        new_cats = format_cats('''${NEW_CATS}''')
        mod_cats = format_cats('''${MOD_CATS}''')
        rem_cats = format_cats('''${REM_CATS}''')
        
        # Build commit message - single line
        msg = f"♻️ Rx Sync • {date_str} • {time_str}"
        
        if new_cats != '0':
            msg += f" • 🆕 New: {new_cats}"
        
        if mod_cats != '0':
            msg += f" • ✏️ Mod: {mod_cats}"
        
        if rem_cats != '0':
            msg += f" • 🗑️ Rem: {rem_cats}"
        
        msg += f" • 📊 Total: ${{ steps.update.outputs.total_records }}"
        
        print(msg)
        PYEOF
        )
        
        if git diff --cached --quiet; then
          echo "No staged changes to commit."
          exit 0
        fi

        git commit -m "$COMMIT_MSG"
        
        # Pull latest changes and merge safely
        git pull origin "${{ github.ref_name }}" --no-rebase
        
        git push origin HEAD:"${{ github.ref_name }}"
    
    - name: Create update summary
      if: always()
      run: |
        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        {
          echo "### ♻️ Rx Sync • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # Check if there are any changes at all
            has_changes = new_cat_str or mod_cat_str or rem_cat_str
            
            if not has_changes:
                print('✅ No updates')
            else:
                # New Additions
                if new_cat_str:
                    print(f'#### 🆕 New Additions: {new_cat_str}')
                    for r in new_recs:
                        print(f'- {r}')
                    print('')
                
                # Modifications
                if mod_cat_str:
                    print(f'#### ✏️ Modifications: {mod_cat_str}')
                    for r in mod_recs:
                        print(f'- {r}')
                    print('')
                
                # Removals
                if rem_cat_str:
                    print(f'#### 🗑️ Removals: {rem_cat_str}')
                    for r in rem_recs:
                        print(f'- {r}')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> "$GITHUB_STEP_SUMMARY"
    
    - name: Send email notification
      if: always()
      run: |
        python3 << 'EOF'
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        import os
        
        # Email configuration
        smtp_server = "smtp.gmail.com"
        smtp_port = 587
        sender_email = "${{ secrets.GMAIL_USERNAME }}"
        app_password = "${{ secrets.GMAIL_APP_PASSWORD }}"
        recipient_email = "${{ secrets.NOTIFICATION_EMAIL }}"
        
        # Get variables from GitHub Actions
        new_cat_stats = "${{ steps.update.outputs.new_cat_stats || 'No new records' }}"
        total_records = "${{ steps.update.outputs.total_records || 'Unknown' }}"
        
        html_body = f"""
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TGPC Rx Registry Sync Report</title>
            <style>
                body {{
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                    background-color: #f8f9fa;
                    margin: 0;
                    padding: 20px;
                    color: #333;
                }}
                .container {{
                    max-width: 600px;
                    margin: 0 auto;
                    background: white;
                    border: 1px solid #e9ecef;
                    border-radius: 4px;
                }}
                .header {{
                    background: #ffffff;
                    border-bottom: 1px solid #e9ecef;
                    padding: 24px;
                }}
                .header h1 {{
                    margin: 0;
                    font-size: 20px;
                    font-weight: 600;
                    color: #2c3e50;
                }}
                .header .subtitle {{
                    margin: 4px 0 0 0;
                    font-size: 14px;
                    color: #6c757d;
                }}
                .content {{
                    padding: 24px;
                }}
                .section {{
                    margin-bottom: 24px;
                }}
                .section-title {{
                    font-size: 16px;
                    font-weight: 600;
                    color: #2c3e50;
                    margin-bottom: 12px;
                    border-bottom: 1px solid #e9ecef;
                    padding-bottom: 8px;
                }}
                .stats {{
                    background: #f8f9fa;
                    border: 1px solid #e9ecef;
                    border-radius: 4px;
                    padding: 16px;
                }}
                .stat-row {{
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 8px;
                }}
                .stat-row:last-child {{
                    margin-bottom: 0;
                }}
                .stat-label {{
                    font-weight: 500;
                    color: #495057;
                }}
                .stat-value {{
                    font-weight: 600;
                    color: #2c3e50;
                }}
                .records-content {{
                    background: #ffffff;
                    border: 1px solid #e9ecef;
                    border-radius: 4px;
                    padding: 16px;
                    font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #495057;
                    white-space: pre-wrap;
                    max-height: 300px;
                    overflow-y: auto;
                }}
                .footer {{
                    background: #f8f9fa;
                    border-top: 1px solid #e9ecef;
                    padding: 16px 24px;
                    font-size: 12px;
                    color: #6c757d;
                    text-align: center;
                }}
                .footer .brand {{
                    font-weight: 600;
                    color: #2c3e50;
                }}
                @media (max-width: 600px) {{
                    body {{
                        padding: 10px;
                    }}
                    .container {{
                        margin: 0;
                    }}
                    .header, .content, .footer {{
                        padding: 16px;
                    }}
                }}
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>TGPC Rx Registry Sync Report</h1>
                    <div class="subtitle">{sync_time}</div>
                </div>
                
                <div class="content">
                    <div class="section">
                        <div class="section-title">Sync Summary</div>
                        <div class="stats">
                            <div class="stat-row">
                                <span class="stat-label">New Records:</span>
                                <span class="stat-value">{new_cat_stats}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Total Records:</span>
                                <span class="stat-value">{total_records}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">New Records Details</div>
                        <div class="records-content">
                            {formatted_records}
                        </div>
                    </div>
                </div>
                
                <div class="footer">
                    <div class="brand">TGPC Rx Registry</div>
                    <div>Automated data synchronization system</div>
                </div>
            </div>
        </body>
        </html>
        """
        
        # Create message
        msg = MIMEMultipart()
        msg['From'] = f"Rx Data ♻ <{sender_email}>"
        msg['To'] = recipient_email
        msg['Subject'] = f"♻️ Data Sync - TGPC Rx Registry - {subject_time}"
        msg.attach(MIMEText(html_body, 'html'))
        
        # Send email
        try:
            server = smtplib.SMTP(smtp_server, smtp_port)
            server.starttls()
            server.login(sender_email, app_password)
            server.send_message(msg)
            server.quit()
            print("✅ Email sent successfully")
        except Exception as e:
            print(f"❌ Failed to send email: {e}")
            print(f"Error details: {str(e)}")
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml
