name: ♻️ Rx Sync

on:
  schedule:
    # Run 6 times daily, evenly spaced (every 4 hours)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST (noon)
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
    - cron: '30 18 * * *'  # 12:00 AM IST (midnight)
    - cron: '30 22 * * *'  # 4:00 AM IST
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false
  push:
    branches: [ exp ]
    paths:
      - '.github/workflows/rx-sync.yml'
      - 'tgpc/**'
      - 'scripts/**'

jobs:
  rx-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Run data update
      id: update
      run: |
        echo "♻️ Starting TGPC data update..."
        
        # Run the update via CLI (outputs stats to GITHUB_OUTPUT automatically)
        python -m tgpc update
        
        echo "success=True" >> $GITHUB_OUTPUT

    
    - name: Check for changes and save new records
      id: changes
      run: |
        if git diff --quiet data/rx.json; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in rx.json"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in rx.json"
          echo ""
          echo "🆕 New Records Added:"
          echo "===================="
          
          # Save new records to a file for later use
          python -c "
        import json
        import subprocess
        
        # Get the diff and extract added lines
        diff_output = subprocess.run(['git', 'diff', 'data/rx.json'], capture_output=True, text=True).stdout
        
        # Parse added records from diff
        new_records = []
        for line in diff_output.split('\n'):
            if line.startswith('+') and not line.startswith('+++') and '{' in line:
                try:
                    # Extract JSON object from the line
                    json_str = line[1:].strip().rstrip(',')
                    record = json.loads(json_str)
                    new_records.append(record)
                except:
                    pass
        
        # Save to file for later use
        with open('/tmp/new_records.json', 'w') as f:
            json.dump(new_records, f)
        
        # Display new records
        if new_records:
            for i, record in enumerate(new_records, 1):
                print(f'{i}. {record.get(\"registration_number\", \"N/A\")} - {record.get(\"name\", \"N/A\")} ({record.get(\"category\", \"N/A\")})')
        else:
            print('No new records could be parsed from diff')
          "
        fi
    
    - name: Sync to Supabase
      if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_sync == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "♻️ Syncing data to Supabase cloud database..."
        python -m tgpc sync
    
    - name: Update last_sync timestamp
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "🕐 Updating last_sync timestamp in Supabase..."
        python3 << 'EOF'
        import os
        from datetime import datetime
        from supabase import create_client

        url = os.environ.get("SUPABASE_URL")
        key = os.environ.get("SUPABASE_SERVICE_KEY")
        
        if url and key:
            supabase = create_client(url, key)
            sync_time = datetime.now().isoformat()
            supabase.table('metadata').upsert({
                'key': 'last_sync',
                'value': sync_time
            }, on_conflict='key').execute()
            print(f"✅ Updated last_sync: {sync_time}")
        else:
            print("⚠️ Missing Supabase credentials")
        EOF
    
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add data files (JSON only)
        git add data/rx.json
        
        # Format category stats for commit message
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        # Generate commit message using Python
        COMMIT_MSG=$(python3 << PYEOF
        import json
        from datetime import datetime, timezone, timedelta
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if stats:
                    parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                    return ', '.join(parts)
                return '0'
            except:
                return '0'
        
        # Get IST time (UTC+5:30) using built-in
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        date_str = now.strftime('%a %d %b %Y').upper()
        time_str = now.strftime('%H:%M IST')
        
        new_cats = format_cats('''${NEW_CATS}''')
        mod_cats = format_cats('''${MOD_CATS}''')
        rem_cats = format_cats('''${REM_CATS}''')
        
        # Build commit message - single line
        msg = f"♻️ Rx Sync • {date_str} • {time_str}"
        
        if new_cats != '0':
            msg += f" • 🆕 New: {new_cats}"
        
        if mod_cats != '0':
            msg += f" • ✏️ Mod: {mod_cats}"
        
        if rem_cats != '0':
            msg += f" • 🗑️ Rem: {rem_cats}"
        
        msg += f" • 📊 Total: ${{ steps.update.outputs.total_records }}"
        
        print(msg)
        PYEOF
        )
        
        git commit -m "$COMMIT_MSG"
        
        # Pull latest changes and merge safely
        git pull origin main --no-rebase
        
        git push
    
    - name: Create update summary
      if: always()
      run: |
        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        echo "### ♻️ Rx Sync • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # Check if there are any changes at all
            has_changes = new_cat_str or mod_cat_str or rem_cat_str
            
            if not has_changes:
                print('✅ No updates')
            else:
                # New Additions
                if new_cat_str:
                    print(f'#### 🆕 New Additions: {new_cat_str}')
                    for r in new_recs:
                        print(f'- {r}')
                    print('')
                
                # Modifications
                if mod_cat_str:
                    print(f'#### ✏️ Modifications: {mod_cat_str}')
                    for r in mod_recs:
                        print(f'- {r}')
                    print('')
                
                # Removals
                if rem_cat_str:
                    print(f'#### 🗑️ Removals: {rem_cat_str}')
                    for r in rem_recs:
                        print(f'- {r}')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> $GITHUB_STEP_SUMMARY
    
    - name: Send email notification
      if: always()
      run: |
        python3 << 'EOF'
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        import os
        
        # Email configuration
        smtp_server = "smtp.gmail.com"
        smtp_port = 587
        sender_email = "${{ secrets.GMAIL_USERNAME }}"
        app_password = "${{ secrets.GMAIL_APP_PASSWORD }}"
        recipient_email = "dinesh.io@outlook.com"
        
        # Generate email body
        import subprocess
        from datetime import datetime, timezone, timedelta
        
        # Get IST time
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        sync_time = now.strftime('%d %B %Y, %H:%M IST')
        subject_time = now.strftime('%d%b%Y %^a %H:%M IST').upper()
        
        # Get new records
        try:
            with open('/tmp/new_records.json', 'r') as f:
                new_records_content = f.read()
            formatted_records = subprocess.run(
                ['python3', 'scripts/format_new_records.py'], 
                input=new_records_content, 
                text=True, 
                capture_output=True
            ).stdout.strip()
        except:
            formatted_records = 'No new records to display'
        
        # Create HTML email
        new_cat_stats = os.environ.get('NEW_CAT_STATS', 'No new records')
        total_records = os.environ.get('TOTAL_RECORDS', 'Unknown')
        
        html_body = f"""
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TGPC Rx Registry Sync Report</title>
            <style>
                body {{
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    margin: 0;
                    padding: 20px;
                    color: #333;
                }}
                .container {{
                    max-width: 600px;
                    margin: 0 auto;
                    background: white;
                    border-radius: 16px;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                    overflow: hidden;
                }}
                .header {{
                    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
                    color: white;
                    padding: 40px 30px;
                    text-align: center;
                    position: relative;
                }}
                .header::before {{
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="50" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="30" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
                }}
                .header h1 {{
                    margin: 0;
                    font-size: 32px;
                    font-weight: 700;
                    position: relative;
                    z-index: 1;
                }}
                .header .subtitle {{
                    margin: 10px 0 0 0;
                    opacity: 0.9;
                    font-size: 16px;
                    position: relative;
                    z-index: 1;
                }}
                .content {{
                    padding: 40px 30px;
                }}
                .sync-time {{
                    background: #f8fafc;
                    border-left: 4px solid #4f46e5;
                    padding: 15px 20px;
                    border-radius: 8px;
                    margin-bottom: 30px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                }}
                .sync-time-icon {{
                    width: 40px;
                    height: 40px;
                    background: #4f46e5;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 18px;
                }}
                .stats-grid {{
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 20px;
                    margin-bottom: 30px;
                }}
                .stat-card {{
                    background: #f8fafc;
                    border-radius: 12px;
                    padding: 25px;
                    text-align: center;
                    border: 1px solid #e2e8f0;
                    transition: transform 0.2s ease, box-shadow 0.2s ease;
                }}
                .stat-card:hover {{
                    transform: translateY(-2px);
                    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
                }}
                .stat-number {{
                    font-size: 28px;
                    font-weight: 700;
                    color: #4f46e5;
                    margin-bottom: 8px;
                }}
                .stat-label {{
                    color: #64748b;
                    font-size: 14px;
                    font-weight: 500;
                }}
                .records-section {{
                    background: #f8fafc;
                    border-radius: 12px;
                    padding: 30px;
                    border: 1px solid #e2e8f0;
                }}
                .section-title {{
                    font-size: 18px;
                    font-weight: 600;
                    color: #1e293b;
                    margin-bottom: 20px;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }}
                .records-content {{
                    background: white;
                    border-radius: 8px;
                    padding: 20px;
                    border: 1px solid #e2e8f0;
                    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #374151;
                    max-height: 300px;
                    overflow-y: auto;
                }}
                .footer {{
                    background: #f8fafc;
                    padding: 30px;
                    text-align: center;
                    border-top: 1px solid #e2e8f0;
                    color: #64748b;
                    font-size: 14px;
                }}
                .footer .brand {{
                    font-weight: 600;
                    color: #4f46e5;
                }}
                .emoji {{
                    font-size: 20px;
                }}
                @media (max-width: 600px) {{
                    .stats-grid {{
                        grid-template-columns: 1fr;
                    }}
                    .container {{
                        margin: 10px;
                        border-radius: 12px;
                    }}
                    .header {{
                        padding: 30px 20px;
                    }}
                    .content {{
                        padding: 30px 20px;
                    }}
                }}
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1><span class="emoji">🔄</span> TGPC Rx Registry</h1>
                    <div class="subtitle">Sync Report • {sync_time}</div>
                </div>
                
                <div class="content">
                    <div class="sync-time">
                        <div class="sync-time-icon">⏰</div>
                        <div>
                            <strong>Last Sync Completed</strong><br>
                            <span style="color: #64748b; font-size: 14px;">{sync_time}</span>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">{new_cat_stats}</div>
                            <div class="stat-label">🆕 New Records</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">{total_records}</div>
                            <div class="stat-label">📊 Total Records</div>
                        </div>
                    </div>
                    
                    <div class="records-section">
                        <div class="section-title">
                            <span class="emoji">📋</span> New Records Details
                        </div>
                        <div class="records-content">
                            {formatted_records}
                        </div>
                    </div>
                </div>
                
                <div class="footer">
                    <div class="brand">TGPC Rx Registry</div>
                    <div>Automated sync notification system</div>
                    <div style="margin-top: 10px; font-size: 12px; opacity: 0.7;">
                        This is an automated message • Do not reply
                    </div>
                </div>
            </div>
        </body>
        </html>
        """
        
        # Create message
        msg = MIMEMultipart()
        msg['From'] = f"Rx Data Sync <{sender_email}>"
        msg['To'] = recipient_email
        msg['Subject'] = f"♻️ Data Sync - TGPC Rx Registry - {subject_time}"
        msg.attach(MIMEText(html_body, 'html'))
        
        # Send email
        try:
            server = smtplib.SMTP(smtp_server, smtp_port)
            server.starttls()
            server.login(sender_email, app_password)
            server.send_message(msg)
            server.quit()
            print("✅ Email sent successfully")
        except Exception as e:
            print(f"❌ Failed to send email: {e}")
            print(f"Error details: {str(e)}")
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml