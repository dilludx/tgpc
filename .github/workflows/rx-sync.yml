name: ♻️ Rx Sync

on:
  schedule:
    # Run 2 times daily
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false

jobs:
  rx-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase requests[socks]
    
    - name: Setup Tor proxy
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tor
        sudo systemctl restart tor
        # Wait for Tor to bootstrap (up to 30s)
        for i in $(seq 1 30); do
          if curl -s --socks5-hostname 127.0.0.1:9050 --max-time 5 https://check.torproject.org/ > /dev/null 2>&1; then
            echo "Tor bootstrapped successfully"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "Tor bootstrap failed after 30s"
            exit 1
          fi
          sleep 1
        done
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Run data update
      id: update
      env:
        HTTPS_PROXY: socks5://127.0.0.1:9050
      run: |
        if [[ "${{ github.event.inputs.force_sync }}" == "true" ]]; then
          if [ ! -f data/rx.json ]; then
            echo "⚠️ No existing data found. Running update instead."
            python -m tgpc update
          else
            echo "⚡ FORCE SYNC MODE - Skipping data update, using existing data"
            {
              echo "success=True"
              echo "total_records=$(python -c 'import json; print(len(json.load(open("data/rx.json"))))')"
              echo "new_records=0"
              echo "modified_records=0"
              echo "removed_records=0"
              echo "integrity_score=1.0"
            } >> "$GITHUB_OUTPUT"
          fi
        else
          echo "♻️ STARTING TGPC DATA UPDATE..."
          python -m tgpc update
        fi
    
    - name: Sync to Supabase
      if: ${{ steps.update.outputs.success == 'True' }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      run: |
        echo "♻️ SYNCING DATA TO SUPABASE CLOUD DATABASE..."
        python -m tgpc sync
    
    - name: Create update summary
      if: always()
      run: |
        UPDATE_STATUS='${{ steps.update.outputs.update_status }}'
        SOURCE_ERROR='${{ steps.update.outputs.source_error }}'

        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        {
          echo "### ♻️ Rx Sync • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$UPDATE_STATUS" = "source_unavailable" ] || [ "$UPDATE_STATUS" = "blocked" ]; then
          {
            echo "⚠️ TGPC source was unreachable during this run."
            echo ""
            if [ -n "$SOURCE_ERROR" ]; then
              echo "Source error: \`$SOURCE_ERROR\`"
              echo ""
            fi
            echo "Existing data was preserved, and Supabase sync / commit steps were skipped."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if [ "$UPDATE_STATUS" = "empty_scrape" ]; then
          {
            echo "🛑 Update aborted because the scraper returned no records."
            echo ""
            echo "Existing data was preserved."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if [ "$UPDATE_STATUS" = "safety_abort" ]; then
          {
            echo "🛑 Update aborted by the safety guard."
            echo ""
            echo "The new scrape dropped below the 90% integrity threshold, so existing data was preserved."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # Check if there are any changes at all
            has_changes = new_cat_str or mod_cat_str or rem_cat_str
            
            if not has_changes:
                print('✅ No updates')
            else:
                # Additions
                if new_cat_str:
                    print(f'#### 🌱 NEW: {new_cat_str}')
                    for r in new_recs:
                        print(f'- {r}')
                    print('')
                
                # Modifications
                if mod_cat_str:
                    print(f'#### 🌀 CHANGES: {mod_cat_str}')
                    for r in mod_recs:
                        print(f'- {r}')
                    print('')
                
                # Removals
                if rem_cat_str:
                    print(f'#### ❌ REMOVALS: {rem_cat_str}')
                    for r in rem_recs:
                        print(f'- {r}')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> "$GITHUB_STEP_SUMMARY"
    
    - name: Send email notification
      if: ${{ steps.update.outputs.success == 'True' }}
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      run: |
        python3 << 'EOF'
        import json, os, re, sys
        from datetime import datetime, timezone, timedelta

        api_key = os.environ.get("RESEND_API_KEY")
        recipient = os.environ.get("NOTIFICATION_EMAIL")
        if not api_key or not recipient:
            print("Missing RESEND_API_KEY or NOTIFICATION_EMAIL")
            sys.exit(0)

        new = json.loads('${{ steps.update.outputs.new_details }}' or '[]')
        mod = json.loads('${{ steps.update.outputs.modified_details }}' or '[]')
        rem = json.loads('${{ steps.update.outputs.removed_details }}' or '[]')

        if not new and not mod and not rem:
            print("No changes")
            sys.exit(0)

        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        sync_time = now.strftime("%d %B %Y, %A, %H:%M IST")
        subj_time = now.strftime("%d%b%Y %a %H:%M IST").upper()

        def cat(s):
            m = re.search(r'\((.*?)\)', s)
            if not m:
                return "Other"
            return {"BPHARM":"BPharm","MPHARM":"MPharm","DPHARM":"DPharm","PHARMD":"PharmD"}.get(m.group(1).upper(), m.group(1).title())

        def reg_no(s):
            m = re.search(r'(\d+)', s)
            return int(m.group(1)) if m else 0

        def fmt_html(title, items, color):
            if not items:
                return ""
            grouped = {}
            for i in items:
                grouped.setdefault(cat(i), []).append(i)
            html = f'<div style="margin-bottom:35px;"><h4 style="margin:0 0 16px;color:{color};font-size:14px;font-weight:700;text-transform:uppercase;border-bottom:2px solid {color};padding-bottom:6px;display:inline-block;letter-spacing:.5px;">{title} ({len(items)})</h4>'
            for c in sorted(grouped):
                recs = grouped[c]
                html += f'<div style="margin-bottom:18px;"><div style="font-size:11px;font-weight:700;color:#111;text-transform:uppercase;margin-bottom:6px;letter-spacing:1px;">{c} ({len(recs)})</div>'
                for r in sorted(recs, key=reg_no):
                    parts = r.split(" - ", 1)
                    reg = parts[0]
                    name = re.sub(r"\s*\(.*?\)$", "", parts[1] if len(parts) > 1 else r).strip()
                    html += f'<div style="font-size:13px;color:#6b7280;padding:4px 0;"><span style="font-family:ui-monospace,monospace;">{reg}</span> - {name}</div>'
                html += "</div>"
            return html + "</div>"

        text = f"TGPC Rx Registry Sync Report\n{sync_time}\n\n"
        html = ('<!DOCTYPE html><html><head><meta charset="UTF-8"></head>'
                '<body style="font-family:-apple-system,sans-serif;background:#fff;padding:15px 20px;color:#333;line-height:1.3;margin:0;">'
                '<div style="max-width:600px;">'
                f'<h2 style="margin:0;font-size:17px;line-height:1.2;"><span style="color:#00cc66;">TGPC</span> <span style="color:#ef4444;">Rx</span> <span style="color:#808080;">Registry</span> Sync Report</h2>'
                f'<div style="color:#666;font-size:12px;margin-bottom:30px;font-weight:500;">{sync_time}</div>'
                f'{fmt_html("🌱 NEW", new, "#00cc66")}{fmt_html("🌀 CHANGES", mod, "#3b82f6")}{fmt_html("❌ REMOVALS", rem, "#ef4444")}'
                '<div style="margin-top:15px;font-size:11px;color:#888;padding-top:10px;">'
                '<div style="font-weight:700;"><span style="color:#00cc66;">TGPC</span> <span style="color:#ef4444;">Rx</span> <span style="color:#808080;">Registry</span></div>'
                '<div>Automated Data Synchronization System</div></div></div></body></html>')

        for label, items in [("NEW",new),("CHANGES",mod),("REMOVALS",rem)]:
            if items:
                text += f"{label} ({len(items)}):\n" + "\n".join(sorted(items, key=lambda x: (cat(x), reg_no(x)))) + "\n\n"
        text += "---\nTGPC Rx Registry\nAutomated Data Synchronization System"

        parts = []
        if new: parts.append(f"🌱 {len(new)}")
        if mod: parts.append(f"🌀 {len(mod)}")
        if rem: parts.append(f"❌ {len(rem)}")
        subject = " | ".join(parts + ["Rx Data Sync", subj_time])

        import urllib.request
        payload = json.dumps({"from":"Rx Data Sync <onboarding@resend.dev>","to":[recipient],"subject":subject,"text":text,"html":html}).encode()
        req = urllib.request.Request("https://api.resend.com/emails", data=payload, headers={"Authorization":f"Bearer {api_key}","Content-Type":"application/json"})
        resp = urllib.request.urlopen(req)
        print(f"Email sent ({resp.status})")
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml
