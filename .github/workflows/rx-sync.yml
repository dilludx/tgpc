name: ♻️ Rx Sync

on:
  schedule:
    # Run 3 times daily, evenly spaced (every 8 hours)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 18 * * *'  # 12:00 AM IST (midnight)
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false

jobs:
  rx-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Check if already updated today
      id: check_update
      run: |
        # Check if we already updated today by looking at recent commits
        TODAY=$(date -u +%Y-%m-%d)
        RECENT_COMMIT=$(git log --oneline --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --grep="🤖 Daily data update" | head -1)
        
        if [ -n "$RECENT_COMMIT" ]; then
          echo "already_updated=true" >> $GITHUB_OUTPUT
          echo "ℹ️ Already updated today: $RECENT_COMMIT"
        else
          echo "already_updated=false" >> $GITHUB_OUTPUT
          echo "✅ No update today yet, proceeding..."
        fi

    - name: Run daily update
      if: steps.check_update.outputs.already_updated == 'false'
      id: update
      run: |
        echo "♻️ Starting daily TGPC data update during business hours..."
        
        # Run the update via CLI
        python -m tgpc update
        
        # Note: The new CLI doesn't output GITHUB_OUTPUT variables yet. 
        # For now, we'll assume success if the command exits with 0.
        # We can enhance the CLI later to output these stats if needed.
        
        echo "success=True" >> $GITHUB_OUTPUT

    
    - name: Check for changes and save new records
      if: steps.check_update.outputs.already_updated == 'false'
      id: changes
      run: |
        if git diff --quiet data/rx.json; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in rx.json"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in rx.json"
          echo ""
          echo "🆕 New Records Added:"
          echo "===================="
          
          # Save new records to a file for later use
          python -c "
        import json
        import subprocess
        
        # Get the diff and extract added lines
        diff_output = subprocess.run(['git', 'diff', 'data/rx.json'], capture_output=True, text=True).stdout
        
        # Parse added records from diff
        new_records = []
        for line in diff_output.split('\n'):
            if line.startswith('+') and not line.startswith('+++') and '{' in line:
                try:
                    # Extract JSON object from the line
                    json_str = line[1:].strip().rstrip(',')
                    record = json.loads(json_str)
                    new_records.append(record)
                except:
                    pass
        
        # Save to file for later use
        with open('/tmp/new_records.json', 'w') as f:
            json.dump(new_records, f)
        
        # Display new records
        if new_records:
            for i, record in enumerate(new_records, 1):
                print(f'{i}. {record.get(\"registration_number\", \"N/A\")} - {record.get(\"name\", \"N/A\")} ({record.get(\"category\", \"N/A\")})')
        else:
            print('No new records could be parsed from diff')
          "
        fi
    
    - name: Sync to Supabase
      if: (steps.check_update.outputs.already_updated == 'false' && steps.changes.outputs.changes == 'true') || github.event.inputs.force_sync == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "♻️ Syncing data to Supabase cloud database..."
        python -m tgpc sync
    
    - name: Commit and push changes
      if: steps.check_update.outputs.already_updated == 'false' && steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add data files (JSON only)
        git add data/rx.json
        
        # Format category stats for commit message
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        NEW_MSG=$(python3 -c "
        import json
        try:
            stats = json.loads('$NEW_CATS') if '$NEW_CATS' else {}
            if stats:
                parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                print(', '.join(parts))
            else:
                print('0')
        except:
            print('0')
        ")
        
        MOD_MSG=$(python3 -c "
        import json
        try:
            stats = json.loads('$MOD_CATS') if '$MOD_CATS' else {}
            if stats:
                parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                print(', '.join(parts))
            else:
                print('0')
        except:
            print('0')
        ")
        
        REM_MSG=$(python3 -c "
        import json
        try:
            stats = json.loads('$REM_CATS') if '$REM_CATS' else {}
            if stats:
                parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                print(', '.join(parts))
            else:
                print('0')
        except:
            print('0')
        ")
        
        # Create commit message with category details
        COMMIT_DATE=$(TZ='Asia/Kolkata' date '+%a %d %b %Y %H:%M IST' | tr '[:lower:]' '[:upper:]')
        git commit -m "♻️ Rx Sync - $COMMIT_DATE
        
        New: $NEW_MSG | Modified: $MOD_MSG | Removed: $REM_MSG | Total: ${{ steps.update.outputs.total_records }}"
        
        # Pull latest changes to avoid push rejection
        git pull --rebase origin main
        
        git push
    
    - name: Create update summary
      if: always()
      run: |
        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        echo "### ♻️ Rx Sync" >> $GITHUB_STEP_SUMMARY
        echo "> **$(TZ='Asia/Kolkata' date '+%A, %d %B %Y')** • $(TZ='Asia/Kolkata' date '+%H:%M IST')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # New Additions - show category counts directly
            if new_cat_str:
                print(f'#### 🆕 New Additions: {new_cat_str}')
            else:
                print(f'#### 🆕 New Additions: 0')
            if new_recs:
                for r in new_recs:
                    print(f'- {r}')
            print('')
            
            # Modifications - show category counts directly
            if mod_cat_str:
                print(f'#### ✏️ Modifications: {mod_cat_str}')
            else:
                print(f'#### ✏️ Modifications: 0')
            if mod_recs:
                for r in mod_recs:
                    print(f'- {r}')
            print('')
                
            # Removals - show category counts directly
            if rem_cat_str:
                print(f'#### 🗑️ Removals: {rem_cat_str}')
            else:
                print(f'#### 🗑️ Removals: 0')
            if rem_recs:
                for r in rem_recs:
                    print(f'- {r}')
            print('')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> $GITHUB_STEP_SUMMARY
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml