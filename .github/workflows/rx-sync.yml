name: ♻️ Rx Sync

on:
  schedule:
    # Run 6 times daily, evenly spaced (every 4 hours)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST (noon)
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
    - cron: '30 18 * * *'  # 12:00 AM IST (midnight)
    - cron: '30 22 * * *'  # 4:00 AM IST
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force_sync:
        description: 'Force Sync to Supabase'
        required: false
        type: boolean
        default: false

jobs:
  rx-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 2
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install supabase
    
    - name: Create data directory
      run: |
        mkdir -p data/backups
    
    - name: Run data update
      id: update
      run: |
        echo "♻️ STARTING TGPC DATA UPDATE..."
        
        # Run the update via CLI (outputs stats to GITHUB_OUTPUT automatically)
        python -m tgpc update
        
        echo "success=True" >> "$GITHUB_OUTPUT"

    
    - name: Check for changes and save new records
      id: changes
      run: |
        rm -f /tmp/new_records.json

        if git diff --quiet data/rx.json; then
          echo "changes=false" >> "$GITHUB_OUTPUT"
          echo "NO CHANGES DETECTED IN RX.JSON"
        else
          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "CHANGES DETECTED IN RX.JSON"
          echo ""
          echo "🌱 RECORDS ADDED:"
          echo "===================="
          
          # Save only truly new registration numbers (JSON-aware, not line-diff based)
          python3 << 'PYEOF'
        import json
        import subprocess
        from pathlib import Path

        current_path = Path("data/rx.json")
        current_records = json.loads(current_path.read_text(encoding="utf-8"))

        base_records = []
        show = subprocess.run(
            ["git", "show", "HEAD:data/rx.json"],
            capture_output=True,
            text=True
        )
        if show.returncode == 0 and show.stdout.strip():
            base_records = json.loads(show.stdout)

        base_ids = {r.get("registration_number") for r in base_records}
        new_records = [
            r for r in current_records
            if r.get("registration_number") and r.get("registration_number") not in base_ids
        ]

        with open("/tmp/new_records.json", "w", encoding="utf-8") as f:
            json.dump(new_records, f, ensure_ascii=False)

        if new_records:
            for i, record in enumerate(new_records, 1):
                print(
                    f"{i}. {record.get('registration_number', 'N/A')} - "
                    f"{record.get('name', 'N/A')} ({record.get('category', 'N/A')})"
                )
        else:
            print("No new records detected")
        PYEOF
        fi
    
    - name: Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "♻️ SYNCING DATA TO SUPABASE CLOUD DATABASE..."
        python -m tgpc sync
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add data files (JSON only)
        git add data/rx.json
        
        # Format category stats for commit message
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        # Generate commit message using Python
        COMMIT_MSG=$(python3 << PYEOF
        import json
        from datetime import datetime, timezone, timedelta
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if stats:
                    parts = [f'{k}: {v}' for k, v in sorted(stats.items(), key=lambda x: x[1], reverse=True)]
                    return ', '.join(parts)
                return '0'
            except:
                return '0'
        
        # Get IST time (UTC+5:30) using built-in
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        date_str = now.strftime('%a %d %b %Y').upper()
        time_str = now.strftime('%H:%M IST')
        
        new_cats = format_cats('''${NEW_CATS}''')
        mod_cats = format_cats('''${MOD_CATS}''')
        rem_cats = format_cats('''${REM_CATS}''')
        
        # Build commit message - single line
        msg = f"♻️ Rx Sync • {date_str} • {time_str}"
        
        if new_cats != '0':
            msg += f" • 🌱 NEW: {new_cats}"
        
        if mod_cats != '0':
            msg += f" • 🌀 CHANGES: {mod_cats}"
        
        if rem_cats != '0':
            msg += f" • ❌ REMOVALS: {rem_cats}"
        
        msg += f" • 📊 Total: ${{ steps.update.outputs.total_records }}"
        
        print(msg)
        PYEOF
        )
        
        if git diff --cached --quiet; then
          echo "No staged changes to commit."
          exit 0
        fi

        git commit -m "$COMMIT_MSG"
        
        # Pull latest changes and merge safely
        git pull origin "${{ github.ref_name }}" --no-rebase
        
        git push origin HEAD:"${{ github.ref_name }}"
    
    - name: Create update summary
      run: |
        # Parse details JSON
        NEW_DETAILS='${{ steps.update.outputs.new_details }}'
        REM_DETAILS='${{ steps.update.outputs.removed_details }}'
        MOD_DETAILS='${{ steps.update.outputs.modified_details }}'
        
        NEW_CATS='${{ steps.update.outputs.new_cat_stats }}'
        REM_CATS='${{ steps.update.outputs.rem_cat_stats }}'
        MOD_CATS='${{ steps.update.outputs.mod_cat_stats }}'
        
        {
          echo "### ♻️ Rx Sync • $(TZ='Asia/Kolkata' date '+%a %d %b %Y' | tr '[:lower:]' '[:upper:]') • $(TZ='Asia/Kolkata' date '+%H:%M IST')"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        
        # Use python to parse JSON and output lists
        python -c "
        import json
        import os
        
        def format_cats(json_str):
            try:
                stats = json.loads(json_str) if json_str else {}
                if not stats: return ''
                # Sort by count desc
                sorted_stats = sorted(stats.items(), key=lambda item: item[1], reverse=True)
                parts = [f'{k}: {v}' for k, v in sorted_stats]
                return ', '.join(parts)
            except: return ''

        try:
            # Handle potential empty strings by defaulting to empty list JSON
            new_json = '$NEW_DETAILS' if '$NEW_DETAILS' else '[]'
            rem_json = '$REM_DETAILS' if '$REM_DETAILS' else '[]'
            mod_json = '$MOD_DETAILS' if '$MOD_DETAILS' else '[]'

            new_recs = json.loads(new_json) or []
            rem_recs = json.loads(rem_json) or []
            mod_recs = json.loads(mod_json) or []
            
            new_cat_str = format_cats('$NEW_CATS')
            rem_cat_str = format_cats('$REM_CATS')
            mod_cat_str = format_cats('$MOD_CATS')
            
            # Check if there are any changes at all
            has_changes = new_cat_str or mod_cat_str or rem_cat_str
            
            if not has_changes:
                print('✅ No updates')
            else:
                # Additions
                if new_cat_str:
                    print(f'#### 🌱 NEW: {new_cat_str}')
                    for r in new_recs:
                        print(f'- {r}')
                    print('')
                
                # Modifications
                if mod_cat_str:
                    print(f'#### 🌀 CHANGES: {mod_cat_str}')
                    for r in mod_recs:
                        print(f'- {r}')
                    print('')
                
                # Removals
                if rem_cat_str:
                    print(f'#### ❌ REMOVALS: {rem_cat_str}')
                    for r in rem_recs:
                        print(f'- {r}')
                
        except Exception as e:
            print(f'Error parsing details: {e}')
        " >> "$GITHUB_STEP_SUMMARY"
    
    - name: Send email notification
      run: |
        python3 << 'EOF'
        import smtplib
        import json
        import re
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from email.utils import formataddr
        from datetime import datetime, timezone, timedelta
        
        # Email configuration
        smtp_server = "smtp.gmail.com"
        smtp_port = 587
        sender_email = "${{ secrets.GMAIL_USERNAME }}"
        app_password = "${{ secrets.GMAIL_APP_PASSWORD }}"
        recipient_email = "${{ secrets.NOTIFICATION_EMAIL }}"
        
        # Get IST time
        ist = timezone(timedelta(hours=5, minutes=30))
        now = datetime.now(ist)
        sync_time = now.strftime("%d %B %Y, %A, %H:%M IST")
        
        # Format subject timestamp: "05MAR2026 THU 09:53 IST"
        subject_time = now.strftime("%d%b%Y %a %H:%M IST").upper()
        
        # Parse details
        new_details = json.loads('${{ steps.update.outputs.new_details }}' or '[]')
        mod_details = json.loads('${{ steps.update.outputs.modified_details }}' or '[]')
        rem_details = json.loads('${{ steps.update.outputs.removed_details }}' or '[]')
        
        # MOCK DATA FOR TEST EMAIL
        if not new_details and not mod_details and not rem_details:
            new_details = ["11111 - TEST NEW (BPHARM)", "11112 - TEST NEW (DPHARM)"]
            mod_details = ["22222 - TEST CHANGE (MPHARM)"]
            rem_details = ["33333 - TEST REMOVAL (PHARMD)"]
        
        def get_reg_no(s):
            match = re.search(r'^(\d+)', s)
            return int(match.group(1)) if match else 0

        def get_category(s):
            match = re.search(r'\((.*?)\)', s)
            return match.group(1).upper() if match else "OTHER"

        def format_html_list(title, items, color, bg_color):
            if not items: return ""
            
            # Group by category
            categories = {}
            for item in items:
                cat = get_category(item)
                if cat not in categories:
                    categories[cat] = []
                categories[cat].append(item)
            
            html = f'<div style="margin-bottom: 24px; padding: 12px 16px; background-color: {bg_color}; border-left: 4px solid {color}; border-radius: 4px;">'
            html += f'<h4 style="margin: 0 0 10px 0; color: {color}; font-size: 14px; font-weight: 700; letter-spacing: 0.2px;">{title} ({len(items)})</h4>'
            
            for cat in sorted(categories.keys()):
                cat_items = sorted(categories[cat], key=get_reg_no)
                html += f'<div style="margin: 12px 0 6px 0; font-weight: 700; font-size: 11px; color: #666; letter-spacing: 0.2px;">{cat} ({len(cat_items)})</div>'
                html += '<ul style="margin: 0; padding-left: 18px; list-style-type: disc; color: #444; font-size: 13px;">'
                for item in cat_items:
                    # Remove redundant category from display string
                    clean_item = re.sub(r"\s*\(.*?\)", "", item)
                    html += f'<li style="margin-bottom: 4px;">{clean_item}</li>'
                html += '</ul>'
            
            html += '</div>'
            return html

        added_html = format_html_list("🌱 New", new_details, "#00cc66", "#f0fdf4")
        mod_html = format_html_list("🌀 Changes", mod_details, "#3b82f6", "#eff6ff")
        rem_html = format_html_list("❌ Removals", rem_details, "#ef4444", "#fef2f2")
        
        # Text body generation (kept simple)
        text_body = f"TGPC Rx Registry Sync Report\n{sync_time}\n\n"
        sections = [("NEW", new_details), ("CHANGES", mod_details), ("REMOVALS", rem_details)]
        for label, items in sections:
            if items:
                text_body += f"{label} ({len(items)}):\n"
                sorted_items = sorted(items, key=lambda x: (get_category(x), get_reg_no(x)))
                text_body += "\n".join(sorted_items) + "\n\n"
        text_body += "---\nTGPC Rx Registry\nAutomated Data Synchronization System"
        
        html_body = (
            "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"></head>" +
            "<body style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #333; line-height: 1.5; margin: 0; padding: 0;\">" +
            "<div style=\"padding: 0;\">" +
            "<h2 style=\"margin: 0 0 4px 0; font-size: 18px;\">" +
            "<span style=\"color: #00cc66;\">TGPC</span> " +
            "<span style=\"color: #ef4444;\">Rx</span> " +
            "<span style=\"color: #808080;\">Registry</span> Sync Report</h2>" +
            "<div style=\"color: #666; font-size: 13px; margin-bottom: 20px;\">" + sync_time + "</div>" +
            
            added_html + mod_html + rem_html +
            
            "<div style=\"margin-top: 25px; padding-top: 5px; font-size: 12px; color: #666; line-height: 1.2;\">" +
            "<div style=\"font-weight: 600; margin-bottom: 0;\">" +
            "<span style=\"color: #00cc66;\">TGPC</span> " +
            "<span style=\"color: #ef4444;\">Rx</span> " +
            "<span style=\"color: #808080;\">Registry</span></div>" +
            "<div style=\"font-weight: normal; color: #999; font-size: 10px;\">Automated Data Synchronization System</div></div></div></body></html>"
        )
        
        # Build dynamic subject: 🌱 3 | 🌀 1 | 05MAR2026 THU 09:53 IST | Rx Data Sync
        subject_parts = []
        if new_details: subject_parts.append(f"🌱 {len(new_details)}")
        if mod_details: subject_parts.append(f"🌀 {len(mod_details)}")
        if rem_details: subject_parts.append(f"❌ {len(rem_details)}")
        
        subject = " | ".join(subject_parts + [subject_time, "Rx Data Sync"])
        
        msg = MIMEMultipart('alternative')
        msg['From'] = formataddr(("Rx Data Sync", sender_email))
        msg['To'] = recipient_email
        msg['Subject'] = subject
        
        msg.attach(MIMEText(text_body, 'plain'))
        msg.attach(MIMEText(html_body, 'html'))
        
        try:
            server = smtplib.SMTP(smtp_server, smtp_port)
            server.starttls()
            server.login(sender_email, app_password)
            server.send_message(msg)
            server.quit()
            print("✅ Email sent successfully")
        except Exception as e:
            print(f"❌ Failed to send email: {e}")
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily update failed! Check the logs above for details."
        echo "The rx.json file was not updated due to validation failures or errors."

  # Trigger website status check after rx-sync completes
  verify-website:
    name: Verify Website Status
    needs: rx-sync
    if: always()  # Run even if rx-sync fails, to check if site is still up
    uses: ./.github/workflows/website-status.yml
