name: UI Checks

on:
  push:
    branches: [main, dev]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      # Placeholder PUBLIC vars: real values are configured in the Cloudflare
      # Pages dashboard; CI only needs them present to complete the build.
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
          PUBLIC_R2_PHOTO_BASE: https://placeholder.r2.dev/photos
