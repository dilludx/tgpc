name: R2 Sync
on: workflow_dispatch
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
    - name: Install awscli
      run: pip install awscli --quiet
    - name: Upload notice attachments
      run: |
        EP="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
        upload() { curl -sL "$1" | aws s3api put-object --endpoint-url "$EP" --bucket tgpc --key "notice/$2" --body /dev/stdin; }
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/exit_examination_circular_23022026.jpg" exit_examination_circular_23022026.jpg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/exit_exam_notification_23022026.jpg" exit_exam_notification_23022026.jpg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/exit_examination_circular.jpg" exit_examination_circular.jpg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/exit_exam_notification.jpg" exit_exam_notification.jpg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Notice_Nov_11_2025_holiday.jpeg" Notice_Nov_11_2025_holiday.jpeg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/CIRCULAR_3.pdf" CIRCULAR_3.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Circular_2.pdf" Circular_2.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/dpharm_circular.jpeg" dpharm_circular.jpeg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/dpharm_affidavit.jpeg" dpharm_affidavit.jpeg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/upskills_notice.jpeg" upskills_notice.jpeg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Circular_1.pdf" Circular_1.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Exit%20Exam%20for%20DPharm%20Course.pdf" Exit_Exam_DPharm.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Candidate%20Registration%20Enrollement%20Process%20Skill%20India%20Digital%20_SID_%20Portal%202.pdf" Candidate_Registration_Enrollement.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/circular_161224.jpeg" circular_161224.jpeg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Election%20Gazette.pdf" Election_Gazette.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/Circulars/Vocational%20Courses%20Bridge%20Courses.pdf" Vocational_Courses_Bridge_Courses.pdf
        upload "https://pharmacycouncil.telangana.gov.in/pdf/ChecklistforUploadDocs/go_ts%20to%20tg.jpg" go_ts_to_tg.jpg
        upload "https://pharmacycouncil.telangana.gov.in/pdf/ChecklistforUploadDocs/tspc_emails_changed.jpeg" tspc_emails_changed.jpeg
