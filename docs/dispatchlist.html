    const BASE_URL = 'https://f94abca8880190e97a8f986b4c4da6dc.r2.cloudflarestorage.com/tgpc';

    function parseDate(filename) {
        const match = filename.match(/DL(\d{2})(\d{2})(\d{4})\.pdf/i);
        if (match) {
            return {
                day: match[1],
                month: match[2],
                year: match[3],
                date: new Date(parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]))
            };
        }
        return null;
    }

    function formatDisplayDate(filename) {
        const parsed = parseDate(filename);
        if (parsed) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${parsed.day} ${months[parsed.month - 1]} ${parsed.year}`;
        }
        return filename.replace('.pdf', '');
    }

    function buildSourceUrl(filename) {
        return `${BASE_URL}/${filename}`;
    }

    function init() {
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const workingCount = document.getElementById('workingCount');

        fileCount.textContent = allFiles.length;

        const files = allFiles.map(f => ({ name: f, date: parseDate(f) }))
            .filter(f => f.date !== null)
            .sort((a, b) => b.date.date - a.date.date);

        workingCount.textContent = files.length;

        fileList.innerHTML = files.map(f => {
            const url = buildSourceUrl(f.name);
            const isBroken = !url;
            return `<a href="${url || '#'}" class="file-item ${isBroken ? 'broken' : ''}" target="_blank" rel="noopener">
                <svg class="file-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
                <span class="file-name">${f.name}</span>
                <span class="file-date">${formatDisplayDate(f.name)}</span>
            </a>`;
        }).join('');
    }
