<!DOCTYPE html>
<html>

<head>
    <title>Supabase Test</title>
</head>

<body>
    <h1>Supabase Metadata Test</h1>
    <div id="result">Loading...</div>
    <pre id="log" style="background: #f5f5f5; padding: 10px;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const log = document.getElementById('log');
        function addLog(msg) {
            log.textContent += msg + '\n';
            console.log(msg);
        }

        async function testSupabase() {
            addLog('Step 1: Checking window.supabase...');
            addLog('window.supabase: ' + typeof window.supabase);

            if (window.supabase) {
                addLog('window.supabase keys: ' + Object.keys(window.supabase).join(', '));
            }

            addLog('Step 2: Creating client...');
            try {
                const client = window.supabase.createClient(
                    'https://vhgpyvzgmvhijqgsapnk.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoZ3B5dnpnbXZoaWpxZ3NhcG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4Njc1MjAsImV4cCI6MjA3ODQ0MzUyMH0.Cp4oyw2M72RCFnsKeLg49hSMvGs4pm6-ul0sFmAasRs'
                );
                addLog('Client created: ' + typeof client);
                addLog('Client keys: ' + Object.keys(client).join(', '));
                addLog('client.from: ' + typeof client.from);

                addLog('Step 3: Fetching metadata...');
                const { data, error } = await client
                    .from('metadata')
                    .select('value')
                    .eq('key', 'last_sync')
                    .single();

                addLog('Response data: ' + JSON.stringify(data));
                addLog('Response error: ' + JSON.stringify(error));

                if (data && data.value) {
                    document.getElementById('result').textContent = 'SUCCESS: ' + data.value;
                    document.getElementById('result').style.color = 'green';
                } else {
                    document.getElementById('result').textContent = 'ERROR: ' + JSON.stringify(error);
                    document.getElementById('result').style.color = 'red';
                }
            } catch (e) {
                addLog('Exception: ' + e.message);
                addLog('Stack: ' + e.stack);
                document.getElementById('result').textContent = 'EXCEPTION: ' + e.message;
                document.getElementById('result').style.color = 'red';
            }
        }

        testSupabase();
    </script>
</body>

</html>
