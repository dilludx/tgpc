<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Green circle with Rx -->
  <circle cx="350" cy="315" r="140" fill="#00cc66"/>
  <text x="350" y="355" font-size="120" font-weight="bold" font-family="Arial, sans-serif" fill="white" text-anchor="middle">Rx</text>
  
  <!-- TGPC text in green -->
  <text x="550" y="290" font-size="100" font-weight="bold" font-family="Arial, sans-serif" fill="#00cc66">TGPC</text>
  
  <!-- Rx Registry text -->
  <text x="550" y="380" font-size="50" font-weight="600" font-family="Arial, sans-serif">
    <tspan fill="#ef4444">Rx</tspan>
    <tspan fill="#808080"> Registry</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="550" y="440" font-size="28" font-family="Arial, sans-serif" fill="#a0a0a0">Telangana Pharmacist Registry</text>
</svg>
