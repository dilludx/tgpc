<!DOCTYPE html>
<html>

<head>
    <title>Index Test - Fixed</title>
</head>

<body>
    <h1>Index Page Test</h1>
    <div class="stats-updated" id="statsUpdated">
        <span class="sync-badge"><span class="check">✓</span><span class="text">Synced</span></span>
        <span id="syncTimestamp">...</span>
    </div>
    <pre id="log" style="background: #f5f5f5; padding: 10px;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Wait for everything to load before running
        async function runTest() {
            const logEl = document.getElementById('log');
            function log(msg) {
                console.log(msg);
                if (logEl) logEl.textContent += msg + '\n';
            }

            log('Test started');
            log('window.supabase: ' + typeof window.supabase);

            if (!window.supabase) {
                log('ERROR: window.supabase not available');
                return;
            }

            // Supabase Configuration
            const SUPABASE_URL = 'https://vhgpyvzgmvhijqgsapnk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoZ3B5dnpnbXZoaWpxZ3NhcG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4Njc1MjAsImV4cCI6MjA3ODQ0MzUyMH0.Cp4oyw2M72RCFnsKeLg49hSMvGs4pm6-ul0sFmAasRs';

            log('Creating supabase client...');
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log('supabase.from: ' + typeof supabase.from);

            // Date/Time constants
            const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            function formatUpdatedTimestamp(date) {
                const dayName = DAYS[date.getDay()];
                const dayNum = String(date.getDate()).padStart(2, '0');
                const monthName = MONTHS[date.getMonth()];
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${dayName} ${dayNum} ${monthName} ${year} ${hours}:${minutes}`;
            }

            // Fetch metadata
            log('Fetching from Supabase...');
            try {
                const { data, error } = await supabase
                    .from('metadata')
                    .select('value')
                    .eq('key', 'last_sync')
                    .single();

                log('Response - data: ' + JSON.stringify(data) + ', error: ' + JSON.stringify(error));

                if (!error && data && data.value) {
                    const syncDate = new Date(data.value);
                    const formatted = formatUpdatedTimestamp(syncDate);
                    document.getElementById('syncTimestamp').textContent = formatted;
                    log('SUCCESS - Timestamp set to: ' + formatted);
                } else {
                    log('No valid data received');
                }
            } catch (e) {
                log('Exception: ' + e.message);
            }
        }

        // Run the test
        runTest();
    </script>
</body>

</html>
