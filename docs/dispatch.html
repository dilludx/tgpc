        .pdf-list { list-style: none; padding: 0; margin: 0; }
        .pdf-item { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; transition: transform 0.2s; }

        .pdf-info { flex: 1; }
        .pdf-date { font-weight: bold; color: #00cc66; margin-bottom: 5px; font-size: 1.1rem; }
        .pdf-filename { font-family: monospace; color: #666; margin-bottom: 5px; word-break: break-all; }
        .pdf-meta { color: #999; font-size: 0.9rem; }
        .btn { background: #00cc66; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-left: 15px; }
        .btn:hover { background: #00a86b; }
        .no-results { text-align: center; padding: 40px; color: #666; }
        .nav-link { color: #00cc66; text-decoration: none; margin: 0 10px; }
        .nav-link:hover { text-decoration: underline; }

        let filteredFiles = [];

        function loadFiles() {
            console.log('Loading', allFiles.length, 'files');
            
            // Create file objects with date parsing
            filteredFiles = allFiles.map(filename => {
                const dateMatch = filename.match(/DL-(\d{4})([A-Z]{3})(\d{2})/);
                if (dateMatch) {
                    const [, year, month, day] = dateMatch;
                    const monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                    const monthIndex = monthNames.indexOf(month);
                    const date = new Date(parseInt(year), monthIndex, parseInt(day));
                    const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    
                    return {
                        filename: filename,
                        url: `dispatchpdf/${filename}`,
                        date: formattedDate,
                        sortDate: date.getTime()
                    };
                }
                return {
                    filename: filename,
                    url: `dispatchpdf/${filename}`,
                    date: 'Unknown',
                    sortDate: 0
                };
            });
            
            // Update stats
            document.getElementById('stats').textContent = `${filteredFiles.length} PDF files found (2019-2026)`;
            
            // Display files (already sorted in array)
            displayFiles();
        }

        function filterFiles() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                filteredFiles = allFiles.map(filename => {
                    const dateMatch = filename.match(/DL-(\d{4})([A-Z]{3})(\d{2})/);
                    if (dateMatch) {
                        const [, year, month, day] = dateMatch;
                        const monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                        const monthIndex = monthNames.indexOf(month);
                        const date = new Date(parseInt(year), monthIndex, parseInt(day));
                        const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                        
                        return {
                            filename: filename,
                            url: `dispatchpdf/${filename}`,
                            date: formattedDate,
                            sortDate: date.getTime()
                        };
                    }
                    return {
                        filename: filename,
                        url: `dispatchpdf/${filename}`,
                        date: 'Unknown',
                        sortDate: 0
                    };
                });
            } else {
                filteredFiles = filteredFiles.filter(file => 
                    file.filename.toLowerCase().includes(searchTerm) ||
                    file.date.toLowerCase().includes(searchTerm)
                );
            }
            
            displayFiles();
        }

        function displayFiles() {
            const list = document.getElementById('pdfList');
            const noResults = document.getElementById('noResults');
            
            if (filteredFiles.length === 0) {
                list.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            list.style.display = 'block';
            noResults.style.display = 'none';
            
            list.innerHTML = filteredFiles.map(file => `
                <li class="pdf-item">
                    <div class="pdf-info">
                        <div class="pdf-date">${file.date}</div>
                        <div class="pdf-filename">${file.filename}</div>
                        <div class="pdf-meta">Click to open TGPC dispatch PDF</div>
                    </div>
                    <a href="${file.url}" class="btn" target="_blank">Open</a>
                </li>
            `).join('');
            
            console.log('Displayed', filteredFiles.length, 'files');
        }
